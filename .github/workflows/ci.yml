name: CI

# Every push / PR        → checks (lint, typecheck, tests, testability audit)
# Push a tag like v1.1.0 → checks → EAS iOS build → auto-submit to TestFlight
# Store builds are slow and go through Apple review, so they only happen on
# a version tag, never on ordinary pushes. Set up with the `cicd-pipeline`
# skill (Template D).

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a release part-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, testability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every check below runs even if an earlier one fails (`!cancelled()`),
      # so a PR shows all problems at once instead of one per push.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # Jest's Babel transform cache. On a cold cache the first render test in
      # a suite can take >5s (the default timeout); package.json sets
      # testTimeout: 20000 for that, and caching keeps runs fast.
      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: jest-${{ runner.os }}-

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npx jest --ci --cacheDirectory .jest-cache

      - name: Testability audit
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          bash scripts/testability-audit.sh | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: EAS build and submit to TestFlight
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-ios
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN — create one at expo.dev → Account settings → Access tokens, then add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The tag is the release version: v1.1.0 must match app.json "version",
      # so a forgotten version bump fails here instead of in App Store review.
      - name: Check tag matches app.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./app.json').expo.version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $version. Bump app.json (or re-tag) and try again."
            exit 1
          fi
          echo "Releasing version $version"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: the job ends once EAS has queued the build; EAS builds and
      # then submits to TestFlight on its own servers. Follow progress with
      # `eas build:list` or on expo.dev.
      - name: Build and auto-submit (iOS, production)
        run: |
          eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
          echo "### iOS build queued for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Track it on expo.dev or with \`eas build:list --platform ios --limit 3\`." >> "$GITHUB_STEP_SUMMARY"
